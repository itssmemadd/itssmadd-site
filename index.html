  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --text:  #111111;
      --muted: #888880;
      --acc:   #9B7E5E;
      --bdr:   rgba(17,17,17,0.15);
      --ease:  cubic-bezier(0.16,1,0.3,1);
      --serif: 'Cormorant', Georgia, serif;
      --sans:  'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--white);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 460px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Avatar */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 1.5rem;
      background: #eee;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    /* Identité */
    .name {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.9rem, 6vw, 2.3rem);
      line-height: 1;
      text-align: center;
    }
    .tagline {
      margin-top: 0.7rem;
      margin-bottom: 1.1rem;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--acc);
      text-align: center;
    }
    .intro {
      margin-bottom: 1.6rem;
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
      text-align: center;
      max-width: 340px;
    }

    /* Trust signals — reviews badge + clickable phone (GEO/AI-search) */
    .trust {
      margin-bottom: 2.4rem;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    .trust a { color: var(--text); }
    .trust a:hover { text-decoration: underline; }

    /* Liens */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border: 1px solid var(--bdr);
      background: transparent;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s var(--ease), color 0.3s var(--ease),
                  transform 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .link:hover {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
      transform: translateY(-2px);
    }
    .link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .link .lbl {
      flex: 1;
      text-align: center;
      /* compense la largeur de l'icône pour centrer optiquement */
      margin-right: 18px;
    }


    .foot {
      margin-top: 2.6rem;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

  <main class="wrap">

    <p class="tagline">Photographer — Portrait · Agadir · Marrakech</p>
    <p class="intro">Portraits, editorials &amp; tailored events.</p>
  
    <nav class="links" id="links" aria-label="Main links"></nav>

  <script>
    /* ════════════════════════════════════════════════════════
       YOUR LINKS — to add / edit / reorder,
       just edit this list. Each line = one button.

       icon : 'site' | 'instagram' | 'mail' | 'whatsapp'
              | 'linkedin' | 'tiktok' | 'contact'
       href : the URL (https://…), a mailto:… or a local file

       Ready-to-paste examples:
         { label:'WhatsApp', href:'https://wa.me/33XXXXXXXXX', icon:'whatsapp' },
         { label:'LinkedIn', href:'https://linkedin.com/in/...', icon:'linkedin' },
         { label:'TikTok',   href:'https://tiktok.com/@...',    icon:'tiktok' },
    ════════════════════════════════════════════════════════ */
    const LINKS = [
      { label: 'Portfolio',  href: 'portfolio/',                               icon: 'site' },
      { label: 'Journal',    href: 'journal/',                                 icon: 'site' },
      { label: 'Instagram',  href: 'https://instagram.com/itss.madd',  icon: 'instagram' },
      { label: 'Booking',    href: 'portfolio/#booking',              icon: 'mail' },
    ];


    /* Icônes (SVG inline, trait = couleur courante) */
    const ICONS = {
      site: '<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.5 4 6 4 9.5s-1.4 7-4 9.5c-2.6-2.5-4-6-4-9.5s1.4-7 4-9.5z"/>',
      instagram: '<rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>',
      mail: '<rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M3 6l9 6 9-6"/>',
      contact: '<path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 20l1-5.5A8.5 8.5 0 1 1 21 11.5z"/>',
      whatsapp: '<path d="M3 21l1.6-4.4A8.5 8.5 0 1 1 7.4 19.4L3 21z"/><path d="M8.5 8c-.3 0-.6.1-.8.4-.3.3-.9.9-.9 2.1s.9 2.5 1 2.6c.1.2 1.8 2.9 4.5 3.9 2.2.9 2.7.7 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.6-.3z"/>',
      linkedin: '<rect x="2.5" y="2.5" width="19" height="19" rx="2"/><path d="M7 10v7M7 7v.01M11 17v-4a2 2 0 0 1 4 0v4M11 10v7"/>',
      tiktok: '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 6.5A4.5 4.5 0 0 0 18.5 11"/>',
    };

    const svg = (name) =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.site}</svg>`;

    const isExternal = (href) => /^https?:/.test(href);

    document.getElementById('links').innerHTML = LINKS.map(l => {
      const tab = isExternal(l.href) ? ' target="_blank" rel="noopener"' : '';
      const url = isExternal(l.href) || /^mailto:/.test(l.href) ? l.href : `https://itssmadd.com/${l.href}`;
      return `<a class="link" href="${url}"${tab}>${svg(l.icon)}<span class="lbl">${l.label}</span></a>`;
    }).join('');
  </script>
